{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white fw-bold">
                    FlaskApp
                </div>
                <div class="list-group list-group-flush">
                    <a href="{{ url_for('users.greetings', name='John', age=30) }}" class="list-group-item list-group-item-action">Greet John</a>
                    <a href="{{ url_for('users.admin') }}" class="list-group-item list-group-item-action">Admin</a>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="card border-0 shadow-sm p-4">
                <h1 class="display-6 fw-bold mb-4">Hello :)</h1>
                <p class="fs-4 mb-2"><strong>User:</strong> {{ name }}</p>
                {% if age %}
                    <p class="fs-5 text-success mb-0"><strong>Age:</strong> {{ age }}</p>
                {% else %}
                    <p class="fs-5 text-danger mb-0"><strong>Age:</strong> Not provided</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
