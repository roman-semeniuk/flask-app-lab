{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="card border-0 shadow-sm p-4">
        <div class="bg-primary text-white rounded p-3 mb-3">
            <h1 class="h3 fw-bold mb-0">Ласкаво просимо до сторінки профілю, {{ username }}</h1>
        </div>
        <p class="text-secondary mb-3">Тут ви можете переглянути інформацію про сесію та вийти з системи.</p>
        <form action="{{ url_for('users.logout') }}" method="post">
            <button type="submit" class="btn btn-danger">Вийти</button>
        </form>
    </div>
</div>
{% endblock %}
