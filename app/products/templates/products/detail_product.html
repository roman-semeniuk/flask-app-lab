{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-secondary">ID: {{ product.id }}</span>
                    <span class="badge bg-success fs-5">${{ product.price }}</span>
                </div>
                <h1 class="h2 fw-bold text-dark mb-3">{{ product.name }}</h1>
                <hr>
                <div class="my-3">
                    <h2 class="h6 text-muted text-uppercase fw-bold mb-2">Опис товару</h2>
                    <p class="fs-5 text-secondary">{{ product.content }}</p>
                </div>
                <div class="mt-4 pt-3 border-top">
                    <a href="{{ url_for('products.index') }}" class="btn btn-outline-secondary">
                        Повернутися до списку
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
