{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0">Каталог товарів</h1>
        <span class="badge bg-secondary fs-6">Всього: {{ products|length }}</span>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="h5 card-title fw-bold text-dark mb-0">{{ product.name }}</h2>
                        <span class="badge bg-success-subtle text-success fs-6">${{ product.price }}</span>
                    </div>
                    <p class="card-text text-secondary small flex-grow-1">{{ product.content }}</p>
                    <div class="pt-3 border-top mt-auto">
                        <a href="{{ url_for('products.detail', product_id=product.id) }}" class="btn btn-primary btn-sm w-100">
                            Детальніше
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
